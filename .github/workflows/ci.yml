name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Foundation contract check
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test

  # When the application stack is locked, add a matrix entry here:
  # strategy:
  #   matrix:
  #     node-version: [20.x]   # or python-version / go-version / etc.
  # And add a setup step + cache step before running make test.
