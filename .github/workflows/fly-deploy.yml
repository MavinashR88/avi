name: Fly Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Deploys the Next.js app to Fly.io on every push to main.
# Requires repo secret FLY_API_TOKEN — see foundation.md §5.
# This job is a no-op if FLY_API_TOKEN is unset (so the workflow is idempotent
# before the secret is provisioned).

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN presence
        id: gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN not configured — skipping deploy step."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup flyctl
        if: steps.gate.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.gate.outputs.skip == 'false'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
